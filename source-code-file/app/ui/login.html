<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>云收集 · 登录</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; 
            background: #f2f0eb; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px;
        }
        .box { 
            background: #ffffff; 
            padding: 2.2rem 2.2rem 1.8rem; 
            border-radius: 4px; 
            width: 380px; 
            border: 1px solid #e8e5e0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .box h2 { 
            font-size: 1.3rem; 
            font-weight: 600; 
            color: #1a1a1a; 
            margin-bottom: 1.2rem;
            padding-bottom: 0.6rem;
            border-bottom: 2px solid #e8e5e0;
        }
        .tips { 
            background: #f6f5f2; 
            padding: 14px 16px; 
            margin-bottom: 1.4rem; 
            border-radius: 3px; 
            font-size: 0.8rem; 
            line-height: 1.7; 
            color: #555;
            border-left: 3px solid #b8a99a;
        }
        .tips strong { color: #1a1a1a; }
        .tips code { 
            background: #e8e5e0; 
            padding: 0 4px; 
            border-radius: 2px; 
            font-size: 0.75rem; 
        }
        .form-group { margin-bottom: 0.8rem; }
        .form-group label { 
            display: block; 
            font-size: 0.8rem; 
            font-weight: 500; 
            color: #333; 
            margin-bottom: 2px; 
        }
        .form-group input { 
            width: 100%; 
            padding: 8px 12px; 
            border: 1px solid #d6d2cc; 
            border-radius: 3px; 
            font-size: 0.9rem; 
            background: #fcfcfb;
        }
        .form-group input:focus { 
            outline: none; 
            border-color: #b8a99a; 
            background: #fff;
        }
        .error { 
            color: #7a4a4a; 
            font-size: 0.8rem; 
            margin-bottom: 0.8rem; 
            background: #f6f0ee; 
            padding: 6px 12px; 
            border-radius: 3px;
        }
        .btn { 
            width: 100%; 
            padding: 10px; 
            background: #2c2c2c; 
            color: #fff; 
            border: none; 
            border-radius: 3px; 
            font-size: 0.9rem; 
            font-weight: 500; 
            cursor: pointer; 
            transition: background 0.15s;
            margin-top: 4px;
        }
        .btn:hover { background: #1a1a1a; }
        .footer-links { 
            margin-top: 1rem; 
            text-align: center; 
            font-size: 0.75rem; 
            color: #bbb; 
        }
        .footer-links a { color: #999; text-decoration: none; }
        .footer-links a:hover { color: #555; }
    </style>
</head>
<body>
    <div class="box">
        <h2>云收集 · 登录</h2>
        
        <div class="tips">
            <strong>管理员指引</strong><br>
            默认账号 <code>admin</code> / 密码 <code>admin123</code><br>
            首次登录后建议修改密码。
        </div>
        
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
        
        <form method="post">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" name="username" required>
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit" class="btn">登录</button>
        </form>
        
        <div class="footer-links">
            <a href="/admin/login">刷新</a>
        </div>
    </div>
</body>
</html>
